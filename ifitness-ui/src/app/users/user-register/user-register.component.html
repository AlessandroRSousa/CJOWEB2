<div class="container">
  <div class="col-lg-6 offset-lg-3 col-sm-12">

    <form #f="ngForm" autocomplete="off" (ngSubmit)="save()">
      <h1 class="text-center">Cadastre-se</h1>

      <div class="mb-2">
        <label for="name">Nome completo*</label>
        <input type="text" name="name" id="name" class="form-control"
          [(ngModel)]="user.name" #name="ngModel"
          required minlength="3" maxlength="50">
        <app-message [control]="name" error="required" text="Informe o nome"></app-message>
        <app-message [control]="name" error="minlength"
          text="Mínimo de {{ name.errors?.['minlength']?.requiredLength }} caracteres. Você digitou apenas {{ name.errors?.['minlength']?.actualLength }}"></app-message>
      </div>

      <div class="mb-2">
        <label for="email">E-mail*</label>
        <input type="email" name="email" id="email" class="form-control"
          [(ngModel)]="user.email" #email="ngModel"
          required email maxlength="50">
        <app-message [control]="email" error="required" text="Informe o e-mail"></app-message>
        <app-message [control]="email" error="email" text="Informe um e-mail válido"></app-message>
      </div>

      <div class="mb-2">
        <label for="password">Senha* (mínimo de 8 caracteres)</label>
        <input type="password" name="password" id="password" class="form-control"
          [(ngModel)]="user.password" #password="ngModel"
          required minlength="8" maxlength="150">
        <app-message [control]="password" error="required" text="Informe a senha"></app-message>
        <app-message [control]="password" error="minlength"
          text="Mínimo de {{ password.errors?.['minlength']?.requiredLength }} caracteres. Você digitou apenas {{ password.errors?.['minlength']?.actualLength }}"></app-message>
      </div>

      <div class="mb-2">
        <label for="passwordConfirmation">Confirme a senha*</label>
        <input type="password" name="passwordConfirmation" id="passwordConfirmation" class="form-control"
          [(ngModel)]="passwordConfirmation" #confirmation="ngModel"
          required>
        <app-message [control]="confirmation" error="required" text="Confirme a senha"></app-message>
        @if (confirmation.touched && confirmation.value && !passwordsMatch()) {
          <div class="invalid-feedback d-block">As senhas não conferem</div>
        }
      </div>

      <div class="mb-2">
        <label for="birthDate">Data de Nascimento*</label>
        <input type="date" name="birthDate" id="birthDate" class="form-control"
          [(ngModel)]="user.birthDate" #birthDate="ngModel"
          required>
        <app-message [control]="birthDate" error="required" text="Informe a data de nascimento"></app-message>
      </div>

      <div class="mb-2">
        <label for="gender">Gênero*</label>
        <select name="gender" id="gender" class="form-select"
          [(ngModel)]="user.gender" #genderField="ngModel"
          required>
          <option value="">Selecione</option>
          @for (gender of genders; track gender.value) {
            <option [value]="gender.value">{{ gender.label }}</option>
          }
        </select>
        <app-message [control]="genderField" error="required" text="Selecione o gênero"></app-message>
      </div>

      <div class="mb-2">
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid || !passwordsMatch()">Salvar</button>
      </div>
      <div class="mb-2">
        <a routerLink="/login" class="btn btn-secondary link">Cancelar</a>
      </div>
    </form>

  </div>
</div>
