<div class="container">
  <div class="col-lg-6 offset-lg-3 col-sm-12">
    <h1 class="text-center">Painel Inicial</h1>
    <h2>Olá, {{ auth.jwtPayload?.name }}!</h2>

    @if (user) {
      <table class="table table-striped table-bordered">
        <tbody>
          <tr>
            <th>Nome</th>
            <td>{{ user.name }}</td>
          </tr>
          <tr>
            <th>E-mail</th>
            <td>{{ user.email }}</td>
          </tr>
          <tr>
            <th>Data de nascimento</th>
            <td>{{ user.birthDate }}</td>
          </tr>
        </tbody>
      </table>
    }

    <p class="text-muted text-center">Em breve: o histórico das suas atividades físicas.</p>
  </div>
</div>
